# ─── AIDEN Ingress (Stage 3.1) ─────────────────────────────────────────
# Routes /api and /api/v1/ws to the backend, everything else to the SPA.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiden-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aiden-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiden-frontend
                port:
                  number: 80
