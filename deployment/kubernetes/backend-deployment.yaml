# ─── AIDEN Backend Deployment (Stage 3.1) ──────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiden-backend
  labels:
    app: aiden-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiden-backend
  template:
    metadata:
      labels:
        app: aiden-backend
    spec:
      containers:
        - name: backend
          image: aiden-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: aiden-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/v1/health/healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
