# ─── AIDEN Frontend Deployment (Stage 3.1) ─────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiden-frontend
  labels:
    app: aiden-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiden-frontend
  template:
    metadata:
      labels:
        app: aiden-frontend
    spec:
      containers:
        - name: frontend
          image: aiden-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
