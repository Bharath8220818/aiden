services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aiden-postgres
    environment:
      POSTGRES_USER: aiden
      POSTGRES_PASSWORD: aiden123
      POSTGRES_DB: aiden
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiden"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiden-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aiden-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiden-network
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aiden-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - aiden-network
    restart: unless-stopped

  # MinIO S3 Storage
  minio:
    image: minio/minio:latest
    container_name: aiden-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiden-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: aiden-backend
    entrypoint: ["/app/docker-entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://aiden:aiden123@postgres:5432/aiden
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: aiden-pipelines
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-jwt-secret-change-in-prod}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: "http://localhost:80,http://localhost:5173,http://localhost:3000"
      PYTORCH_NO_CUDA: "1"
      DEBUG: "True"
      SKIP_DB_SEED: "false"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@example.com}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo1234}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aiden-network
    restart: unless-stopped
    volumes:
      - backend_media:/app/uploads

  # Frontend UI
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: aiden-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - aiden-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  backend_media:

networks:
  aiden-network:
    driver: bridge