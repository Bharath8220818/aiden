services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aiden-postgres-prod
    environment:
      POSTGRES_USER: aiden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure-password}
      POSTGRES_DB: aiden
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiden"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiden-network
    restart: always
    security_opt:
      - no-new-privileges:true

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aiden-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD:-secure-redis-password} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiden-network
    restart: always
    security_opt:
      - no-new-privileges:true

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aiden-qdrant-prod
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - aiden-network
    restart: always
    security_opt:
      - no-new-privileges:true

  # MinIO S3 Storage
  minio:
    image: minio/minio:latest
    container_name: aiden-minio-prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiden-network
    restart: always
    security_opt:
      - no-new-privileges:true

  # Backend API
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: aiden-backend-prod
    env_file:
      - ../../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://aiden:${POSTGRES_PASSWORD}@postgres:5432/aiden
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: "HS256"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aiden-network
    restart: always
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend UI
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: aiden-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - aiden-network
    restart: always
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  minio_data:
    driver: local

networks:
  aiden-network:
    driver: bridge
