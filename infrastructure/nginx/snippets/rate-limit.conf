# Rate-limit policy — keep in sync with nginx.conf zones (auth 10r/s, api
# 50r/s, static 100r/s) and the backend's RATE_LIMIT_PER_MINUTE (60/min per IP).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;
limit_req_status 429;

# Apply per location, e.g.:
#   location /api/v1/auth/ { limit_req zone=auth burst=20 nodelay; ... }
#   location /api/         { limit_req zone=api  burst=100 nodelay; ... }
