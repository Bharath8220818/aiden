# AIDEN API gateway — single entry point for the built frontend + backend API.
# Enabled with: docker compose --profile gateway up
# Serves frontend/dist statically, proxies /api and /ws to uvicorn, applies
# security headers and per-route-class rate limiting (auth endpoints stricter).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ------------------------------------------------------------------ #
    # Rate-limit zones (per route class)
    # ------------------------------------------------------------------ #
    # Auth surface (login/logout/me): strict — 10 r burst 20, key by IP.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    # General API: 50 r/s per IP with a modest burst.
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    # Static assets / SPA: generous.
    limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;

    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        # -------------------------------------------------------------- #
        # Security headers
        # -------------------------------------------------------------- #
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # Allow the Vite dev origin during development; tighten CSP per-env.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: http://localhost:* https:;" always;

        # Large uploads (requirements: documents/diagrams) — 25 MB.
        client_max_body_size 25m;

        # -------------------------------------------------------------- #
        # Auth endpoints — strictest zone
        # -------------------------------------------------------------- #
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://backend:8000;
            include /etc/nginx/aiden_proxy.conf;
        }

        # -------------------------------------------------------------- #
        # WebSocket — upgrade headers, long timeouts, no buffering
        # -------------------------------------------------------------- #
        location /ws {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # -------------------------------------------------------------- #
        # API — general zone
        # -------------------------------------------------------------- #
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://backend:8000;
            include /etc/nginx/aiden_proxy.conf;
        }

        # Docs & OpenAPI (dev convenience).
        location ~ ^/(docs|redoc|openapi.json) {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend:8000;
            include /etc/nginx/aiden_proxy.conf;
        }

        # -------------------------------------------------------------- #
        # Static SPA — immutable asset hashing, HTML fallback for routing
        # -------------------------------------------------------------- #
        location /assets/ {
            limit_req zone=static burst=200 nodelay;
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            limit_req zone=static burst=200 nodelay;
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
