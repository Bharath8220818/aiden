# ─── AIDEN Dependabot Configuration ───────────────────────────────────────
# Keeps Python (pip) and JavaScript (npm) dependencies up-to-date.
# Runs every Monday so the team can review and merge updates early in the week.
# ───────────────────────────────────────────────────────────────────────────

version: 2
updates:
  # ── Backend: Python (pip) ──
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Group minor/patch updates into a single PR to reduce noise
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # ── Frontend: JavaScript / TypeScript (npm) ──
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      react-patch:
        patterns:
          - "react*"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      build-tools:
        patterns:
          - "vite*"
          - "typescript"
          - "tailwindcss*"
          - "postcss*"
          - "autoprefixer"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "vitest*"
          - "@testing-library*"
          - "jsdom"
          - "happy-dom"
        update-types:
          - "minor"
          - "patch"
      other-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
