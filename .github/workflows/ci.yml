name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install ruff

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Format check (ruff format)
        run: python -m ruff format --check .

      - name: Tests (pytest)
        run: python -m pytest tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

  frontend:
    name: Frontend — eslint + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: Typecheck + build
        run: npm run build

  e2e:
    name: E2E — Playwright (AIDEN closed loop)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Migrate + seed backend
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m scripts.seed_database
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./aiden_ci.db"

      - name: Start backend
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # Wait for health
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health/healthz && break
            sleep 1
          done
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./aiden_ci.db"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server
        run: |
          npm run dev -- --port 5173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ && break
            sleep 1
          done
        env:
          VITE_API_URL: "http://localhost:8000/api/v1"
          VITE_WS_URL: "ws://localhost:8000/ws"
          VITE_ENABLE_MOCK_DATA: "false"

      - name: Run Playwright E2E
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
