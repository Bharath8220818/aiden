# ─── AIDEN CI — Push Checks ─────────────────────────────────────────────
# Runs on every push to ANY branch:
#   1. Frontend: TypeScript type-check + unit tests + production build
#   2. Backend: Python compile check
#   3. Secret scanning (Gitleaks) — catches .env, credentials, keys, tokens
#
# This is the fast-feedback gate for the PR checklist in docs/SETUP.md.
# The heavier AI Integration workflow (Docker build, model downloads) is
# triggered separately on PRs to main/develop.
# ────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches:
      - "**"  # every branch
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "infrastructure/docker/nignx/**"
      - "*.md"

  workflow_dispatch: # manual trigger from GitHub UI

# ─── Environment ────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

# ─── Concurrency ────────────────────────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════
jobs:

  # ──────────────────────────────────────────────────────────────────────
  # 1. FRONTEND CHECKS
  # ──────────────────────────────────────────────────────────────────────
  frontend:
    name: "Frontend (tsc + test + build)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────
  # 2. BACKEND COMPILE CHECK
  # ──────────────────────────────────────────────────────────────────────
  backend:
    name: "Backend (compile check)"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile check
        working-directory: backend
        run: python -c "import compileall; compileall.compile_dir('.')"

  # ──────────────────────────────────────────────────────────────────────
  # 3. SECRET SCANNING (Gitleaks)
  #    Scans the full git history for accidentally-committed secrets:
  #    .env files, API keys, tokens, passwords, private keys, etc.
  #    Fails the workflow if any secrets are detected.
  # ──────────────────────────────────────────────────────────────────────
  secrets:
    name: "Secret scan (Gitleaks)"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for Gitleaks to scan all commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false  # don't post PR comments
          GITLEAKS_ENABLE_UPLOAD: false     # don't upload to Gitleaks Cloud

  # ──────────────────────────────────────────────────────────────────────
  # 3. STATUS SUMMARY
  # ──────────────────────────────────────────────────────────────────────
  status:
    name: "Status"
    if: always()
    needs: [frontend, backend, secrets]
    runs-on: ubuntu-latest

    steps:
      - name: Summarize results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FE="${{ needs.frontend.result }}"
          BE="${{ needs.backend.result }}"
          SEC="${{ needs.secrets.result }}"

          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (tsc + test + build) | $FE |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (compile check) | $BE |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret scan | $SEC |" >> $GITHUB_STEP_SUMMARY

          if [ "$FE" != "success" ] || [ "$BE" != "success" ] || [ "$SEC" != "success" ]; then
            exit 1
          fi
