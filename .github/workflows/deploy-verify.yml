name: Deploy verify — phase_a smoke

# Runs the repo's Phase A acceptance harness (backend/scripts/phase_a/smoke.py)
# against the DEPLOYED backend so deployment regressions — bad env vars, a
# paused Supabase project, a Render config change, a bad release — surface
# automatically instead of being discovered by a human at demo time.
#
# Triggers:
#   workflow_dispatch — verify the deployment on demand (after a Render deploy,
#     after touching env vars, before a demo).
#   schedule          — every 6 hours; catches drift on free-tier services
#     (Render cold-start failures, Supabase pausing, expiring credentials).
#
# Deliberately NOT on push: Render auto-deploys from the same push, so a push
# trigger would race the deploy and could verify the previous release.
#
# Configuration (repo Settings → Secrets and variables → Actions):
#   Variable DEPLOYED_API_URL (optional) — API root, e.g.
#     https://aiden-backend-fq08.onrender.com  (the default below).

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed API root (overrides the configured default)"
        required: false
        default: ""
  schedule:
    # Every 6 hours at minute 17 past — off the busy top-of-hour.
    - cron: "17 */6 * * *"

concurrency:
  group: deploy-verify
  cancel-in-progress: false

jobs:
  smoke:
    name: Phase A smoke — deployed backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target URL
        id: target
        run: |
          INPUT_URL="${{ inputs.base_url }}"
          VAR_URL="${{ vars.DEPLOYED_API_URL }}"
          URL="${INPUT_URL:-${VAR_URL:-https://aiden-backend-fq08.onrender.com}}"
          echo "url=${URL%/}" >> "$GITHUB_OUTPUT"
          echo "Verifying deployment: ${URL%/}"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install harness dependency (httpx only)
        run: python -m pip install --upgrade pip && pip install "httpx==0.28.1"

      # Render free tier sleeps after inactivity and cold starts take ~1 min;
      # give the deployment up to 10 minutes to answer health before gating.
      - name: Wait for the deployment to answer health
        run: |
          BASE="${{ steps.target.outputs.url }}"
          for i in $(seq 1 60); do
            if curl -sf -m 10 "${BASE}/api/v1/health/healthz" | grep -q '"healthy"'; then
              echo "Backend healthy on attempt ${i}"
              exit 0
            fi
            echo "Attempt ${i}/60 — backend not answering yet; sleeping 10s"
            sleep 10
          done
          echo "::error::Backend did not become healthy within 10 minutes: ${BASE}"
          exit 1

      # Registers a throwaway smoke-<ts>@aiden-test.dev account and drives the
      # full acceptance flow: auth (401 negatives), workspace → project →
      # requirement → pipeline → run, knowledge retrieval, viewer 403 (RBAC),
      # then best-effort cleanup of what it created.
      - name: Run phase_a smoke suite
        run: python -m scripts.phase_a.smoke --base-url "${{ steps.target.outputs.url }}"

      - name: Annotate deployment identity
        if: always()
        run: |
          echo "### Deploy verify result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${{ steps.target.outputs.url }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Suite: \`backend/scripts/phase_a/smoke.py\` (14 gates)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
