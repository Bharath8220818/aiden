<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="aiden-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background hex/diamond container -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#14171C" stroke="#242831" stroke-width="1.5"/>
  <!-- Neural node circuit icon -->
  <path d="M12 28L20 12L28 28" stroke="url(#aiden-grad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M15 23H25" stroke="url(#aiden-grad)" stroke-width="2.8" stroke-linecap="round" />
  <!-- Data pulse spark -->
  <circle cx="20" cy="12" r="2.5" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="12" cy="28" r="2" fill="#6366F1" />
  <circle cx="28" cy="28" r="2" fill="#8B5CF6" />
</svg>
