[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aiden-cli"
version = "0.1.0"
description = "AIDEN CLI — Terminal interface for the Autonomous Intelligence Data Engineering Nexus"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AIDEN Team"}]
dependencies = [
    "click>=8.1",
    "httpx>=0.25",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
aiden = "aiden_cli.cli:main"

[tool.setuptools.packages.find]
include = ["aiden_cli*"]
